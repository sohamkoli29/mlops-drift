name: mlops-drift

services:
  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    image: mlops-drift-mlflow:latest
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: mlops-drift-api:latest
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PREDICTION_DB: /app/logs/predictions.db
    ports:
      - "8000:8000"
    volumes:
      - prediction_logs:/app/logs
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/live')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  monitor:
    build:
      context: .
      dockerfile: docker/Dockerfile.monitor
    image: mlops-drift-monitor:latest
    environment:
      PREDICTION_DB: /app/logs/predictions.db
      MONITOR_DIR: /app/monitor
      MONITOR_INTERVAL: "10"
    ports:
      - "8001:8001"
    volumes:
      - prediction_logs:/app/logs
      - ./data/reference:/app/data/reference:ro
      - ./reports/live:/app/monitor
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/metrics')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mlflow_data:
  prediction_logs:
  prometheus_data:
  grafana_data:
